<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Prism Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap">
<style>
:root {
  --bg: #05040a;
  --panel: rgba(18, 14, 34, 0.86);
  --panel-border: rgba(120, 90, 255, 0.35);
  --accent: #37f0ff;
  --accent2: #ff37a4;
  --text: #eef0ff;
  --text-dim: #9a95c2;
  --gold: #ffd23b;
  font-size: 16px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
body { font-family: 'Rajdhani', sans-serif; color: var(--text); }
h1, h2, h3, .title-font { font-family: 'Orbitron', sans-serif; letter-spacing: 0.03em; }

#app { position: relative; width: 100%; height: 100%; }
#game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #05040a; }

#ui-root { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
#ui-root .interactive { pointer-events: auto; }

.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 20%, rgba(80,40,140,0.35), rgba(4,3,10,0.92) 70%);
  pointer-events: auto; overflow-y: auto; padding: 24px;
}

.panel {
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px;
  box-shadow: 0 0 40px rgba(120,90,255,0.15), inset 0 0 40px rgba(80,40,140,0.08);
  padding: 24px; backdrop-filter: blur(6px);
}

.game-title {
  font-size: clamp(2.4rem, 6vw, 4.2rem); font-weight: 900; margin: 0 0 6px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: 0 0 40px rgba(55,240,255,0.35);
}
.subtitle { color: var(--text-dim); margin-bottom: 28px; letter-spacing: 0.2em; text-transform: uppercase; font-size: 0.85rem; }

.menu-list { display: flex; flex-direction: column; gap: 10px; width: min(360px, 86vw); }

.btn {
  font-family: 'Orbitron', sans-serif; font-size: 0.95rem; letter-spacing: 0.05em;
  background: linear-gradient(135deg, rgba(55,240,255,0.14), rgba(255,55,164,0.1));
  border: 1px solid var(--panel-border); color: var(--text); border-radius: 10px;
  padding: 13px 18px; cursor: pointer; text-align: left; transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s;
}
.btn:hover { transform: translateX(4px); border-color: var(--accent); box-shadow: 0 0 18px rgba(55,240,255,0.35); }
.btn:active { transform: scale(0.98); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #05040a; font-weight: 700; }
.btn.secondary { background: rgba(255,255,255,0.04); }
.btn.small { padding: 8px 12px; font-size: 0.8rem; border-radius: 8px; }
.btn.danger { border-color: rgba(255,80,80,0.5); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

.row { display: flex; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.grid { display: grid; gap: 12px; }

.topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 16px 22px; pointer-events: none; }
.topbar .btn { pointer-events: auto; }
.currency-badge, .xp-badge { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; background: rgba(0,0,0,0.4); border: 1px solid var(--panel-border); border-radius: 20px; padding: 6px 14px; }
.currency-badge { color: var(--gold); }

.close-x { position: absolute; top: 16px; right: 16px; }

/* Level select */
.level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; width: min(1000px, 92vw); max-height: 62vh; overflow-y: auto; padding: 4px; }
.level-card { border-radius: 12px; padding: 14px; cursor: pointer; border: 1px solid var(--panel-border); background: rgba(255,255,255,0.03); transition: transform 0.12s, box-shadow 0.12s; }
.level-card:hover { transform: translateY(-3px); box-shadow: 0 6px 24px rgba(55,240,255,0.2); }
.level-card .lname { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
.level-card .lmeta { font-size: 0.78rem; color: var(--text-dim); display: flex; justify-content: space-between; margin-top: 8px; }
.stars { color: var(--gold); letter-spacing: 2px; }
.coin-pips span { opacity: 0.25; }
.coin-pips span.on { opacity: 1; }
.progress-bar { height: 5px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; margin-top: 8px; }
.progress-bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }

.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
.chip { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--panel-border); font-size: 0.78rem; cursor: pointer; background: rgba(255,255,255,0.03); }
.chip.active { background: var(--accent); color: #05040a; font-weight: 700; }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
#hud .progress-track { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: min(50%, 420px); height: 8px; background: rgba(255,255,255,0.12); border-radius: 6px; overflow: hidden; }
#hud .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0%; }
#hud .attempt-badge { position: absolute; top: 12px; left: 14px; font-family: 'Orbitron'; font-size: 0.75rem; background: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 8px; }
#hud .coin-hud { position: absolute; top: 12px; right: 14px; display: flex; gap: 6px; }
#hud .coin-hud .pip { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,0.12); }
#hud .coin-hud .pip.on { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
#hud .practice-badge { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); font-size: 0.7rem; color: var(--accent); letter-spacing: 0.15em; }

.death-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 20; }
.death-flash.show { animation: flashfx 0.25s ease-out; }
@keyframes flashfx { from { opacity: 0.55; } to { opacity: 0; } }

.overlay-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.overlay-center .panel { pointer-events: auto; text-align: center; }

.small-text { font-size: 0.78rem; color: var(--text-dim); }
.hint { font-size: 0.8rem; color: var(--text-dim); margin-top: 10px; }

input[type=range] { width: 100%; accent-color: var(--accent); }
select, input[type=text] { background: rgba(255,255,255,0.06); border: 1px solid var(--panel-border); color: var(--text); border-radius: 6px; padding: 6px 8px; font-family: 'Rajdhani'; }
label.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; font-size: 0.85rem; color: var(--text-dim); }

.tabs { display: flex; gap: 6px; margin-bottom: 18px; }
.tabs .chip { font-size: 0.85rem; }

.cosmetic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; max-height: 50vh; overflow-y: auto; }
.cosmetic-card { border: 1px solid var(--panel-border); border-radius: 10px; padding: 10px; text-align: center; background: rgba(255,255,255,0.03); }
.cosmetic-card.equipped { border-color: var(--accent); box-shadow: 0 0 14px rgba(55,240,255,0.3); }
.swatch { width: 100%; height: 60px; border-radius: 8px; margin-bottom: 8px; }

.ach-list, .stat-list { display: grid; gap: 10px; width: min(640px, 92vw); max-height: 60vh; overflow-y: auto; }
.ach-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--panel-border); background: rgba(255,255,255,0.03); }
.ach-item.locked { opacity: 0.45; }
.stat-row { display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(120,90,255,0.4); border-radius: 4px; }

/* Editor */
#editor-toolbar { position: absolute; top: 0; left: 0; bottom: 0; width: 220px; background: rgba(10,8,20,0.92); border-right: 1px solid var(--panel-border); padding: 14px; overflow-y: auto; pointer-events: auto; z-index: 6; }
#editor-toolbar .btn { width: 100%; margin-bottom: 6px; }
#editor-props { position: absolute; top: 0; right: 0; bottom: 0; width: 220px; background: rgba(10,8,20,0.92); border-left: 1px solid var(--panel-border); padding: 14px; overflow-y: auto; pointer-events: auto; z-index: 6; }

.toast { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(10,8,20,0.95); border: 1px solid var(--accent); padding: 10px 18px; border-radius: 10px; font-size: 0.85rem; z-index: 30; pointer-events: none; }

</style>
</head>
<body>
<div id="app">
  <canvas id="game-canvas"></canvas>
  <div id="hud"></div>
  <div class="death-flash" id="death-flash"></div>
  <div id="ui-root"></div>
</div>
<script>

const __cache = {};

const { EventBus } = __require('core/Utils.js');
const { getLevelsByCategory } = __require('levels/levelList.js');

function categoryCleared(save, cat) {
  const ids = getLevelsByCategory(cat).map((l) => l.id);
  return ids.length > 0 && ids.every((id) => save.data.levels[id]?.completed);
}
function categoryAny(save, cat) {
  const ids = getLevelsByCategory(cat).map((l) => l.id);
  return ids.some((id) => save.data.levels[id]?.completed);
}
function totalUnlocks(save) {
  const d = save.data;
  return d.unlockedShapes.length + d.unlockedTrails.length + d.unlockedColors.length
    + d.unlockedDeathEffects.length + d.unlockedIcons.length + d.unlockedBgEffects.length;

function fullCoinLevelCount(save) {
  return Object.values(save.data.levels).filter((l) => l.coins.every(Boolean)).length;

const ACHIEVEMENT_LIST = [
  { id: 'first_clear', name: 'First Clear', desc: 'Complete your first level.', reward: { xp: 30, currency: 20 }, test: (s) => s.stats.levelsCompleted >= 1 },
  { id: 'ten_levels', name: 'Getting Good', desc: 'Complete 10 levels.', reward: { xp: 60, currency: 40 }, test: (s) => s.stats.levelsCompleted >= 10 },
  { id: 'twentyfive_levels', name: 'Seasoned Runner', desc: 'Complete 25 levels.', reward: { xp: 100, currency: 70 }, test: (s) => s.stats.levelsCompleted >= 25 },
  { id: 'all_levels', name: 'Completionist', desc: 'Complete all 50 levels.', reward: { xp: 400, currency: 300 }, test: (s) => s.stats.levelsCompleted >= 50 },
  { id: 'coins_25', name: 'Coin Collector', desc: 'Collect 25 coins.', reward: { xp: 50, currency: 30 }, test: (s) => s.stats.coinsCollected >= 25 },
  { id: 'coins_75', name: 'Coin Hoarder', desc: 'Collect 75 coins.', reward: { xp: 90, currency: 60 }, test: (s) => s.stats.coinsCollected >= 75 },
  { id: 'coins_150', name: 'Coin Master', desc: 'Collect 150 coins in total.', reward: { xp: 150, currency: 110 }, test: (s) => s.stats.coinsCollected >= 150 },
  { id: 'die_100', name: 'Glutton For Punishment', desc: 'Die 100 times.', reward: { xp: 40, currency: 25 }, test: (s) => s.stats.totalDeaths >= 100 },
  { id: 'die_500', name: 'Unbreakable Will', desc: 'Die 500 times.', reward: { xp: 120, currency: 90 }, test: (s) => s.stats.totalDeaths >= 500 },
  { id: 'jumps_1000', name: 'Spring Loaded', desc: 'Jump 1,000 times.', reward: { xp: 60, currency: 35 }, test: (s) => s.stats.totalJumps >= 1000 },
  { id: 'distance_10k', name: 'Long Haul', desc: 'Travel 10,000 units.', reward: { xp: 60, currency: 35 }, test: (s) => s.stats.totalDistance >= 10000 },
  { id: 'distance_100k', name: 'Marathoner', desc: 'Travel 100,000 units.', reward: { xp: 150, currency: 100 }, test: (s) => s.stats.totalDistance >= 100000 },
  { id: 'easy_all', name: 'Easy Does It', desc: 'Complete all Easy levels.', reward: { xp: 80, currency: 50 }, testSave: (s) => categoryCleared(s, 'Easy') },
  { id: 'normal_all', name: 'Normal Order', desc: 'Complete all Normal levels.', reward: { xp: 100, currency: 70 }, testSave: (s) => categoryCleared(s, 'Normal') },
  { id: 'hard_all', name: 'Hardened', desc: 'Complete all Hard levels.', reward: { xp: 130, currency: 90 }, testSave: (s) => categoryCleared(s, 'Hard') },
  { id: 'insane_first', name: 'Insane Debut', desc: 'Complete an Insane level.', reward: { xp: 100, currency: 70 }, testSave: (s) => categoryAny(s, 'Insane') },
  { id: 'insane_all', name: 'Insanity Cleared', desc: 'Complete all Insane levels.', reward: { xp: 180, currency: 130 }, testSave: (s) => categoryCleared(s, 'Insane') },
  { id: 'demon_first', name: 'Demon Slayer', desc: 'Complete a Demon level.', reward: { xp: 220, currency: 160 }, testSave: (s) => categoryAny(s, 'Demon') },
  { id: 'demon_all', name: 'Apex Predator', desc: 'Complete every Demon level.', reward: { xp: 400, currency: 300 }, testSave: (s) => categoryCleared(s, 'Demon') },
  { id: 'no_death_clear', name: 'Flawless', desc: 'Complete a level without dying once.', reward: { xp: 60, currency: 40 }, event: 'level:complete', onEvent: (p) => p.deaths === 0 && !p.practiceMode },
  { id: 'all_coins_level', name: 'Perfectionist', desc: 'Collect all 3 coins in a single run.', reward: { xp: 50, currency: 35 }, event: 'level:complete', onEvent: (p) => p.totalCoins > 0 && p.coinsCollected === p.totalCoins },
  { id: 'all_coins_10', name: 'Coin Purist', desc: 'Fully coin 10 different levels.', reward: { xp: 120, currency: 90 }, testSave: (s) => fullCoinLevelCount(s) >= 10 },
  { id: 'practice_clear', name: 'Study Session', desc: 'Beat a level in Practice Mode.', reward: { xp: 30, currency: 15 }, event: 'level:complete', onEvent: (p) => p.practiceMode },
  { id: 'daily_first', name: 'Creature Of Habit', desc: 'Complete your first Daily Challenge.', reward: { xp: 40, currency: 30 }, event: 'daily:complete', onEvent: () => true },
  { id: 'daily_streak_7', name: 'Weekly Warrior', desc: 'Reach a 7-day Daily Challenge streak.', reward: { xp: 150, currency: 120 }, testSave: (s) => s.dailyChallenge.streak >= 7 },

  { id: 'shop_collector', name: 'Style Icon', desc: 'Unlock 15 cosmetic items.', reward: { xp: 100, currency: 0 }, testSave: (s) => totalUnlocks(s) >= 21 },
  { id: 'level10_reach', name: 'Rising Star', desc: 'Reach player level 10.', reward: { xp: 0, currency: 80 }, testSave: (s) => s.playerLevel >= 10 },
  { id: 'level25_reach', name: 'Veteran', desc: 'Reach player level 25.', reward: { xp: 0, currency: 200 }, testSave: (s) => s.playerLevel >= 25 },
  { id: 'editor_first', name: 'Level Designer', desc: 'Save a level in the Editor.', reward: { xp: 50, currency: 40 }, testSave: (s) => s.editorLevels.length >= 1 },
  { id: 'first_checkpoint', name: 'Safety Net', desc: 'Place a checkpoint in Practice Mode.', reward: { xp: 10, currency: 10 }, event: 'practice:checkpoint-added', onEvent: () => true },

const RECHECK_EVENTS = [
  'level:complete', 'level:death', 'level:coin', 'level:jump', 'progression:level-up',
  'daily:complete', 'practice:checkpoint-added', 'editor:save', 'shop:purchase',
];

class Achievements {
  constructor(save) {
    this.save = save;
    this._unsubs = [];
    for (const ev of RECHECK_EVENTS) this._unsubs.push(EventBus.on(ev, () => this.recheckAll()));
    for (const a of ACHIEVEMENT_LIST) {
      if (a.event) this._unsubs.push(EventBus.on(a.event, (p) => this._tryUnlock(a, () => a.onEvent(p))));

    try { pass = !!predicate(); } catch { pass = false; }

    EventBus.emit('achievement:unlocked', { id: a.id, name: a.name, reward: a.reward });

// Centralised save/load for all player progress. Everything lives under one
// localStorage key so we can version and migrate the shape in one place.

const SAVE_KEY = 'prismrush.save.v1';
const SAVE_VERSION = 1;

function defaultSave() {
  return {
    version: SAVE_VERSION,
    currency: 150,
    xp: 0,
    playerLevel: 1,
    unlockedShapes: ['classic'],
    unlockedTrails: ['none'],
    unlockedColors: ['neon-cyan'],
    unlockedDeathEffects: ['spark'],
    unlockedIcons: ['default'],
    unlockedBgEffects: ['none'],
    equipped: { shape: 'classic', trail: 'none', color: 'neon-cyan', deathEffect: 'spark', icon: 'default', bgEffect: 'none' },
    levels: {}, // id -> { bestPercent, completed, coins:[false,false,false], attempts, bestTimeMs, deaths }
    achievements: {}, // id -> { unlocked, unlockedAt }
    stats: {
      totalAttempts: 0, totalDeaths: 0, levelsCompleted: 0, coinsCollected: 0,
      totalPlaytimeMs: 0, bestLevelId: null, hardestLevelCompleted: null,
      totalJumps: 0, totalDistance: 0, practiceSessions: 0,
    },
    settings: {
      musicVolume: 0.7, sfxVolume: 0.8, graphicsQuality: 'high',
      screenShake: true, particles: true, fullscreen: false,
      keybinds: { jump: 'Space', pause: 'Escape', altJump: 'ArrowUp' },
      colorblindMode: false, reduceFlash: false, uiScale: 1,
    },
    dailyChallenge: { lastSeed: null, lastCompletedDate: null, streak: 0 },
    editorLevels: [], // user-created level data blobs
    createdAt: Date.now(),

function migrate(data) {
  const base = defaultSave();
  return deepMerge(base, data || {});
}

function deepMerge(base, override) {
  if (Array.isArray(base)) return override !== undefined ? override : base;
  if (typeof base === 'object' && base !== null) {
    const out = { ...base };
    for (const k of Object.keys(override || {})) {
      out[k] = typeof base[k] === 'object' && base[k] !== null && !Array.isArray(base[k])
        ? deepMerge(base[k], override[k])
        : override[k];
    }
    return out;
  }
  return override !== undefined ? override : base;
}

class SaveSystem {
  constructor() {
    this.data = this.load();
  }

  load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return defaultSave();
      return migrate(JSON.parse(raw));
    } catch (e) {
      console.warn('Save corrupted, resetting.', e);
      return defaultSave();
    }
  }

  save() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(this.data));
    } catch (e) {
      console.warn('Failed to persist save', e);
    }
  }

  reset() {
    this.data = defaultSave();
    this.save();
  }

    if (!this.data.levels[levelId]) {
      this.data.levels[levelId] = { bestPercent: 0, completed: false, coins: [false, false, false], attempts: 0, bestTimeMs: null, deaths: 0 };

// disappearing platforms) and resolves collisions between the player and
// the level each frame. Pure functions of (level, player, time) so it is
// trivially testable / reusable by the editor's test-play mode.

function aabbOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function circleAabbOverlap(cx, cy, r, box) {
  const nx = Math.max(box.x, Math.min(cx, box.x + box.w));
  const ny = Math.max(box.y, Math.min(cy, box.y + box.h));
  const dx = cx - nx, dy = cy - ny;

      const off = Math.sin(t * s.speed + s.phase) * s.amplitude;
      if (s.axis === 'y') { s.y = s.baseY + off; s.x = s.baseX; }
      else { s.x = s.baseX + off; s.y = s.baseY; }
    } else if (s.type === 'disappearingPlatform') {
      const cycle = s.onTime + s.offTime;
      const local = ((t + s.phase) % cycle + cycle) % cycle;
      s.visible = local < s.onTime;

  for (const h of level.hazards) {
    if (h.movingHazard) {
      const off = Math.sin(t * h.speed + h.phase) * h.amplitude;
      if (h.axis === 'y') { h.y = h.baseY + off; } else { h.x = h.baseX + off; }
    }

function  resolvePlayer(level, player, input, dt) {
  const box = player.getHitbox();
  const result = { dead: false, landed: false, events: [] };

  // Solids (ground/blocks/platforms) — land on top, otherwise crash.
  for (const s of level.solids) {
    if (s.type === 'disappearingPlatform' && !s.visible) continue;
    if (!aabbOverlap(box, s)) continue;
    const prevBottom = box.y + box.h - player.vy * dt - 1;
    const fallingOntoTop = player.gravityDir === 1 ? (player.vy >= 0 && prevBottom <= s.y + 6) : false;

      player.y = s.y - player.halfSize;
      player.vy = 0;
      player.onGround = true;
      result.landed = true;
    } else if (risingOntoBottom) {
      player.y = s.y + s.h + player.halfSize;
      player.vy = 0;
      player.onGround = true;
      result.landed = true;
    } else {

    }
  }

  // Hazards
  for (const h of level.hazards) {
    if (h.fake) continue; // visually identical, but harmless
    let hit = false;
    if (h.shape === 'circle') hit = circleAabbOverlap(h.x, h.y, h.r, box);
    else hit = aabbOverlap(box, h);
    if (hit) { result.dead = true; break; }

  if (player.y > level.killY || player.y < -400) result.dead = true;

  // Pads
  for (const p of level.pads) {

      player.vy = -p.power * player.gravityDir;

  for (const p of level.portals) {

  for (const c of level.coins) {
    if (!c.collected && Math.hypot(box.x + box.w / 2 - c.x, box.y + box.h / 2 - c.y) < c.r + 16) {
      c.collected = true;
      result.events.push({ type: 'coin', coin: c });

  if (level.end && box.x + box.w >= level.end.x) result.events.push({ type: 'complete' });

// The Daily Challenge is a freshly composed level, deterministic per
// calendar date (UTC) so every player sees the same layout on a given day.

const { LevelBuilder, PATTERNS } = __require('levels/patterns.js');
const O = __require('level/Objects.js');
const { mulberry32, hashStringToSeed, choice, themeFromHue } = __require('core/Utils.js');
const { TRACKS } = __require('audio/AudioEngine.js');

const ALL_STYLES = Object.keys(PATTERNS);
const TRACK_KEYS = Object.keys(TRACKS);

function  todayKey(date = new Date()) {
  return date.toISOString().slice(0, 10);
}

function  getDailyLevel(dateKey = todayKey()) {
  const seed = hashStringToSeed(`daily:${dateKey}`);
  const rng = mulberry32(seed);
  const difficultyScale = 0.35 + rng() * 0.4;
  const patternCount = 6 + Math.round(difficultyScale * 8);
  const styles = [];
  for (let i = 0; i < 5; i++) styles.push(choice(rng, ALL_STYLES));

  const b = new LevelBuilder(500);
  let coinsPlaced = 0;
  const checkpoints = [0.3, 0.6, 0.9].map((f) => Math.round(patternCount * f));
  for (let i = 0; i < patternCount; i++) {
    if (rng() < 0.25) b.addPad(choice(rng, ['yellow', 'pink']), 850, 90);
    PATTERNS[choice(rng, styles)](b, rng, difficultyScale);
    b.advance(70 + rng() * 50);
    if (coinsPlaced < 3 && checkpoints.includes(i)) { b.addCoin(140, true); coinsPlaced++; }
  }
  while (coinsPlaced < 3) { b.addCoin(140, true); b.advance(90); coinsPlaced++; }

  const endX = b.cursor + 420;
  b.finalizeGround(endX);
  const hue = Math.floor(rng() * 360);

  return {
    id: 'daily', name: `Daily Run — ${dateKey}`, difficulty: Math.round(3 + difficultyScale * 6), category: 'Daily',
    musicTrack: TRACK_KEYS[seed % TRACK_KEYS.length], theme: themeFromHue(hue, dateKey),
    length: endX, groundY: 500, killY: 900, startForm: 'runner',
    solids: b.solids, hazards: b.hazards, pads: b.pads, rings: b.rings, portals: b.portals, coins: b.coins,
    end: O.endFlag(endX - 100, 500),
  };
}

return { todayKey, getDailyLevel };
};

__defs['levels/generator.js'] = function(__require) {
// Turns level metadata (levelList.js) into a fully playable level object.
// Levels 1-5 are hand-authored; everything else is composed deterministically
// from the pattern library so re-generating the same id always yields the
// same layout (needed for level select stats / best-time comparisons).

const { LevelBuilder, PATTERNS } = __require('levels/patterns.js');
const O = __require('level/Objects.js');
const { mulberry32, choice } = __require('core/Utils.js');
const { getLevelMeta } = __require('levels/levelList.js');
const { isAuthored, buildAuthoredLevel } = __require('levels/authored.js');

const cache = new Map();

function composeLevel(meta) {
  const rng = mulberry32(meta.seed);
  const b = new LevelBuilder(500);
  const diff = meta.difficultyScale;
  let coinsPlaced = 0;
  const coinCheckpoints = [0.28, 0.55, 0.85].map((f) => Math.round(meta.patternCount * f));

  for (let i = 0; i < meta.patternCount; i++) {
    if (rng() < 0.22 + diff * 0.1) b.addPad(choice(rng, ['yellow', 'pink']), 820 + rng() * 260, 90);
    else if (rng() < 0.14) b.addRing(680 + rng() * 200, null, 90);

    const key = choice(rng, meta.styles);
    PATTERNS[key](b, rng, diff);
    b.advance(70 + rng() * 60);

    if (coinsPlaced < 3 && coinCheckpoints.includes(i)) {
      b.addCoin(130 + rng() * 90, true);
      coinsPlaced++;
    }
  }
  while (coinsPlaced < 3) {
    b.addCoin(140, true);
    b.advance(90);
    coinsPlaced++;
  }

  const endX = b.cursor + 420;
  b.finalizeGround(endX);

  return {
    id: meta.id, name: meta.name, difficulty: meta.difficulty, category: meta.category,
    musicTrack: meta.musicTrack, theme: meta.theme, length: endX, groundY: 500, killY: 900,
    startForm: 'runner',
    solids: b.solids, hazards: b.hazards, pads: b.pads, rings: b.rings, portals: b.portals, coins: b.coins,
    end: O.endFlag(endX - 100, 500),
  };
}

function  generateLevel(id) {
  if (cache.has(id)) return cloneRuntime(cache.get(id));
  const meta = getLevelMeta(id);
  if (!meta) throw new Error(`No such level: ${id}`);
  const level = isAuthored(id) ? buildAuthoredLevel(meta) : composeLevel(meta);
  cache.set(id, level);
  return cloneRuntime(level);
}

// LevelRuntime mutates object state (coin.collected, portal._armed, platform
// positions) in place, so every fresh attempt needs its own deep copy of the
// static layout while sharing the same underlying design.
function cloneRuntime(level) {
  return {
    ...level,
    solids: level.solids.map((s) => ({ ...s })),
    hazards: level.hazards.map((h) => ({ ...h })),
    pads: level.pads.map((p) => ({ ...p })),
    rings: level.rings.map((r) => ({ ...r })),
    portals: level.portals.map((p) => ({ ...p })),
    coins: level.coins.map((c) => ({ ...c })),
    end: { ...level.end },
  };
}

return { generateLevel };
};

// Metadata for all 50 levels. Each entry drives both the procedural
// generator (styles/difficultyScale) and the UI (name/category/theme/music).
// Levels 1-5 are hand-authored (see authored.js); 6-50 are composed from the
// pattern library in patterns.js, so every level still gets a unique,
// deterministic layout, palette and soundtrack seed.

const { mulberry32, hashStringToSeed, pick, themeFromHue } = __require('core/Utils.js');
const { TRACKS } = __require('audio/AudioEngine.js');

const NAMES = [
  'First Steps', 'Double Take', 'Ring Test', 'Flip Side', 'Takeoff',
  'Neon Alley', 'Block Party', 'Skyline Dash', 'Gapminder', 'Easy Street Ends',
  'Circuit Drift', 'Static Bloom', 'Afterglow', 'Vertigo Line', 'Echo Chamber',
  'Pulse Width', 'Fracture Point', 'Glass Ceiling', 'Loop Back', 'Overclock',
  'Ion Trail', 'Split Signal', 'Hollow Grid', 'Wrong Turn', 'Freefall Protocol',
  'Cascade Fault', 'Night Cycle', 'Prism Break', 'Recoil', 'Last Light',
  'Voltage Spike', 'Blackout Run', 'Severance', 'Warp Static', 'Ashen Circuit',
  'Null Gravity', 'Fever Dream', 'Wire Storm', 'Collapse Theory', 'The Undertow',
  'Emberfall', 'Corrosion', 'Deadlock', 'Vantablack', 'Paradox Loop',
  'The Reckoning', 'Hollow King', 'Requiem Line', 'Singularity', 'Apex Demon',
];

const CATEGORY_DEFS = [
  { key: 'Easy', start: 1, end: 10, diff: [0.04, 0.28], stars: [1, 2], styleCount: 3,
    pool: ['reaction', 'precision', 'zigzag', 'fake', 'timedJumps'] },
  { key: 'Normal', start: 11, end: 20, diff: [0.30, 0.48], stars: [3, 4], styleCount: 4,
    pool: ['reaction', 'precision', 'zigzag', 'fake', 'timedJumps', 'movingPlatforms', 'disappearing', 'portals', 'gravity'] },
  { key: 'Hard', start: 21, end: 30, diff: [0.50, 0.68], stars: [5, 6], styleCount: 5,
    pool: ['reaction', 'precision', 'zigzag', 'movingPlatforms', 'disappearing', 'portals', 'gravity', 'reverseGravity', 'flight', 'speedChanges'] },
  { key: 'Insane', start: 31, end: 40, diff: [0.70, 0.86], stars: [7, 8], styleCount: 6,
    pool: ['reaction', 'precision', 'zigzag', 'movingPlatforms', 'disappearing', 'portals', 'gravity', 'reverseGravity', 'flight', 'speedChanges', 'rhythm', 'boss', 'fake', 'timedJumps'] },
  { key: 'Demon', start: 41, end: 50, diff: [0.88, 1.0], stars: [9, 10], styleCount: 7,
    pool: ['reaction', 'precision', 'zigzag', 'movingPlatforms', 'disappearing', 'portals', 'gravity', 'reverseGravity', 'flight', 'speedChanges', 'rhythm', 'boss', 'chase', 'fake', 'timedJumps'] },

__defs['levels/patterns.js'] = function(__require) {
// LevelBuilder: a small DSL for laying out a level left-to-right. Ground is
// assumed continuous; calling gap() carves a hole that must be jumped,
// flown over, or bridged with a platform. Patterns below are the 15
// gameplay "styles" requested for level variety — each is a reusable,
// difficulty-scaled chunk of obstacles a level composes several of.

const O = __require('level/Objects.js');
const { clamp } = __require('core/Utils.js');

class LevelBuilder {
  constructor(groundY = 500) {
    this.groundY = groundY;
    this.cursor = 320;
    this.solids = [];
    this.hazards = [];
    this.pads = [];
    this.rings = [];
    this.portals = [];
    this.coins = [];
    this.gaps = [];
  }

  advance(w) { this.cursor += w; return this.cursor; }

  gap(width) {
    const x1 = this.cursor, x2 = this.cursor + width;
    this.gaps.push({ x1, x2 });
    this.cursor = x2;
    return { x1, x2 };
  }

  addSpike(spacingAfter = 90, opts = {}) {
    this.hazards.push(O.spike(this.cursor, this.groundY, opts));
    this.advance(spacingAfter);
  }

  addFakeSpike(spacingAfter = 90, opts = {}) {
    this.hazards.push(O.fakeSpike(this.cursor, this.groundY, opts));
    this.advance(spacingAfter);
  }

  addSaw(opts = {}, spacingAfter = 110) {
    this.hazards.push(O.saw(this.cursor, opts.y ?? this.groundY - 40, opts));
    this.advance(spacingAfter);
  }

  addSawTrack(opts = {}, spacingAfter = 150) {
    this.hazards.push(O.sawTrack(this.cursor, opts.y ?? this.groundY - 60, opts));
    this.advance(spacingAfter);
  }

  addBlock(w, h, spacingAfter = 90, yTop = null) {
    const yRef = yTop !== null ? yTop + h : this.groundY;
    this.solids.push(O.block(this.cursor, yRef, w, h));
    this.advance(spacingAfter);
  }

  addWallPair(w, floorTopY, ceilBottomY, spacingAfter = 140) {
    const floorH = Math.max(4, this.groundY - floorTopY);
    const ceilH = Math.max(4, ceilBottomY);
    this.solids.push(O.block(this.cursor, this.groundY, w, floorH));
    this.solids.push(O.block(this.cursor, ceilBottomY, w, ceilH));
    this.advance(spacingAfter);
  }

  addMovingPlatform(w, h, opts = {}, spacingAfter = 150) {
    this.solids.push(O.movingPlatform(this.cursor, this.groundY - (opts.height ?? 60), w, h, opts));
    this.advance(spacingAfter);
  }

  addDisappearingPlatform(w, h, opts = {}, spacingAfter = 130) {
    this.solids.push(O.disappearingPlatform(this.cursor, this.groundY, w, h, opts));
    this.advance(spacingAfter);
  }

  addPad(kind, power, spacingAfter = 100) {
    this.pads.push(O.pad(this.cursor, this.groundY, { kind, power }));
    this.advance(spacingAfter);
  }

  addRing(power, y, spacingAfter = 100) {
    this.rings.push(O.ring(this.cursor, y ?? this.groundY - 90, { power }));
    this.advance(spacingAfter);
  }

  addPortal(effect, label = '', spacingAfter = 60) {
    this.portals.push(O.portal(this.cursor, this.groundY - 90, 200, effect, { label }));
    this.advance(spacingAfter);
  }

  addCoin(yOffset = 140, hard = false) {
    this.coins.push(O.coin(this.cursor, this.groundY - yOffset, { hard }));
  }

  finalizeGround(endX) {
    const sorted = [...this.gaps].sort((a, b) => a.x1 - b.x1);
    let last = 0;
    const segs = [];

      if (g.x1 > last) segs.push({ x1: last, x2: g.x1 });
      last = Math.max(last, g.x2);

// --- 15 gameplay-style pattern chunks -------------------------------------

function  patternReaction(b, rng, diff) {
  const n = 3 + Math.round(diff * 3);
  for (let i = 0; i < n; i++) {
    b.gap(55 + rng() * 15);
    b.addSpike(60 - diff * 14);
  }
}

function  patternPrecision(b, rng, diff) {
  const n = 3 + Math.round(diff * 2);
  for (let i = 0; i < n; i++) {
    b.gap(70 + rng() * 12);
    b.addBlock(36, 30, 110);
  }
}

function  patternGravity(b, rng, diff) {

  const n = 3 + Math.round(diff * 3);
  for (let i = 0; i < n; i++) b.addSpike(95, { ceiling: i % 2 === 0 });
  b.addPortal({ gravity: 1, form: 'runner' }, 'NORMAL');
}

function  patternReverseGravity(b, rng, diff) {
  b.addPortal({ gravity: -1 }, 'FLIP');
  const n = 3 + Math.round(diff * 2);
  for (let i = 0; i < n; i++) {
    b.addBlock(40, 34, 100, i % 2 === 0 ? 40 : null);
  }
  b.addPortal({ gravity: 1 }, 'FLIP');
}

function  patternFlight(b, rng, diff) {
  b.addPortal({ form: 'glider' }, 'FLY');
  const n = 5 + Math.round(diff * 5);
  let windowY = b.groundY - 150;
  for (let i = 0; i < n; i++) {
    windowY = clamp(windowY + (rng() - 0.5) * (70 + diff * 50), b.groundY - 260, b.groundY - 70);
    const gapH = 130 - diff * 30;
    b.addWallPair(56, windowY + gapH / 2, windowY - gapH / 2, 150 - diff * 15);
  }
  b.addPortal({ form: 'runner' }, 'LAND');
}

function  patternZigzag(b, rng, diff) {
  const n = 5 + Math.round(diff * 4);
  let high = false;
  for (let i = 0; i < n; i++) {
    b.gap(60);
    b.addBlock(40, high ? 96 : 40, 60);
    high = !high;
  }
}

function  patternMovingPlatforms(b, rng, diff) {
  const n = 3 + Math.round(diff * 2);
  const spacing = 150;
  const start = b.cursor;
  b.gap(spacing * n + 60);
  let x = start + 90;
  for (let i = 0; i < n; i++) {
    b.solids.push(O.movingPlatform(x, b.groundY - 40, 74, 20, { axis: 'y', amplitude: 40 + diff * 40, speed: 1.1 + diff * 0.6, phase: i * 1.4 }));
    x += spacing;
  }
}

function  patternDisappearing(b, rng, diff) {
  const n = 3 + Math.round(diff * 3);
  const spacing = 130;
  const start = b.cursor;
  b.gap(spacing * n + 40);
  let x = start + 80;
  for (let i = 0; i < n; i++) {
    b.solids.push(O.disappearingPlatform(x, b.groundY, 64, 20, { onTime: 1.1 - diff * 0.3, offTime: 0.6 + diff * 0.2, phase: i * 0.5 }));
    x += spacing;
  }
}

function  patternFakeObstacles(b, rng, diff) {
  const n = 3 + Math.round(diff * 2);
  for (let i = 0; i < n; i++) {
    if (rng() < 0.5) b.addFakeSpike(95);
    else b.addSpike(95);
  }
}

function  patternTimedJumps(b, rng, diff) {
  const n = 3 + Math.round(diff * 2);
  for (let i = 0; i < n; i++) {
    b.addSawTrack({ axis: 'x', amplitude: 60 + diff * 30, speed: 1.4 + diff * 0.5, phase: i, y: b.groundY - 50 }, 160);
    b.gap(70);
  }
}

function  patternSpeedChanges(b, rng, diff) {
  const speeds = [1.4, 0.75, 1.6, 1];
  for (const s of speeds) {
    b.addPortal({ speedMult: s }, s > 1 ? 'FAST' : 'SLOW');
    const n = 2 + Math.round(diff * 2);
    for (let i = 0; i < n; i++) b.addSpike(90 * (2 - s));
  }
  b.addPortal({ speedMult: 1 }, 'NORMAL');
}

function  patternPortals(b, rng, diff) {
  const forms = ['orb', 'runner', 'booster', 'runner'];
  for (const f of forms) {
    b.addPortal({ form: f, gravity: 1 }, f.toUpperCase());
    const n = 2 + Math.round(diff * 2);
    for (let i = 0; i < n; i++) {
      if (f === 'booster') b.addSpike(100);
      else b.addBlock(36, 34, 100);
    }
  }
}

function  patternBoss(b, rng, diff) {
  // A dense, telegraphed multi-hazard gauntlet that reads as a "boss room".
  b.addPortal({ speedMult: 1.15 }, 'DANGER');
  const waves = 3 + Math.round(diff * 2);
  for (let w = 0; w < waves; w++) {
    b.addSawTrack({ axis: 'y', amplitude: 70, speed: 2 + diff, phase: w, y: b.groundY - 70 }, 150);
    b.addSpike(80);
    b.addSpike(80);
    b.gap(70);
  }
  b.addPortal({ speedMult: 1 }, 'CLEAR');
}

function  patternChase(b, rng, diff) {
  // A relentless low-ceiling corridor that reads as being "chased" —
  // the shrinking headroom forces a no-stalling sprint to the exit.
  b.addPortal({ speedMult: 1.25 }, 'RUN');
  const n = 5 + Math.round(diff * 4);
  for (let i = 0; i < n; i++) {
    b.addWallPair(50, b.groundY - 40, 130 + (i % 3) * 20, 120);
  }
  b.addPortal({ speedMult: 1 }, 'SAFE');
}

function  patternRhythm(b, rng, diff) {
  const n = 6 + Math.round(diff * 4);
  for (let i = 0; i < n; i++) {
    b.addSpike(64); // evenly spaced spike train synced to the music grid
  }
}

const PATTERNS = {
  reaction: patternReaction,
  precision: patternPrecision,
  gravity: patternGravity,
  reverseGravity: patternReverseGravity,
  flight: patternFlight,
  zigzag: patternZigzag,
  movingPlatforms: patternMovingPlatforms,
  disappearing: patternDisappearing,
  fake: patternFakeObstacles,
  timedJumps: patternTimedJumps,
  speedChanges: patternSpeedChanges,
  portals: patternPortals,
  boss: patternBoss,
  chase: patternChase,
  rhythm: patternRhythm,
};

return { patternReaction, patternPrecision, patternGravity, patternReverseGravity, patternFlight, patternZigzag, patternMovingPlatforms, patternDisappearing, patternFakeObstacles, patternTimedJumps, patternSpeedChanges, patternPortals, patternBoss, patternChase, patternRhythm, LevelBuilder, PATTERNS };
};

__defs['player/Player.js'] = function(__require) {
// Player physics for all five movement forms. The player's screen X is
// fixed; the world scrolls underneath (camera.x == player's world X minus
// the fixed screen offset). Collision resolution happens in CollisionSystem
// which calls back into hooks exposed here (land(), die(), etc).

const FORMS = {
  RUNNER: 'runner',   // cube-like: discrete jump, gravity flip via portals
  GLIDER: 'glider',   // ship-like: hold to fly up, free vertical movement
  ORB: 'orb',         // ball-like: tap flips gravity instantly, rolls
  PULSE: 'pulse',     // wave-like: diagonal zigzag, thin hitbox
  BOOSTER: 'booster', // ufo-like: tap = fixed burst jump, multi-tap chains
};

const GRAVITY = 2200;
const RUNNER_JUMP = 780;
const GLIDER_THRUST = 1500;
const GLIDER_MAX_VY = 620;
const PULSE_DIAG_SPEED = 520;
const BOOSTER_BURST_VY = -560;

class Player {
  constructor() {
    this.reset();
  }

  reset(startX = 0, groundY = 500) {
    this.worldX = startX;
    this.y = groundY - 30;
    this.vy = 0;
    this.size = 30;
    this.baseSize = 30;
    this.mini = false;
    this.form = FORMS.RUNNER;
    this.gravityDir = 1; // 1 = normal (down), -1 = flipped
    this.onGround = false;
    this.rotation = 0;
    this.speedMult = 1;
    this.baseSpeed = 340;
    this.alive = true;
    this.trailTimer = 0;
    this.boosterUsed = false;
    this.justLanded = false;
    this.deathAt = null;
  }

  get speed() { return this.baseSpeed * this.speedMult; }
  get halfSize() { return (this.mini ? this.size * 0.6 : this.size) / 2; }

  setForm(form) {
    this.form = form;
    this.boosterUsed = false;
    if (form === FORMS.GLIDER || form === FORMS.PULSE) this.onGround = false;
  }

  setGravity(dir) { this.gravityDir = dir; }
  setMini(mini) { this.mini = mini; }
  setSpeedMult(mult) { this.speedMult = mult; }

  // ceilingY/groundY define the current flight corridor (levels can narrow it)
  update(dt, input, groundY, ceilingY = -Infinity) {
    if (!this.alive) return;
    const g = GRAVITY * this.gravityDir;
    this.worldX += this.speed * dt;

    switch (this.form) {
      case FORMS.RUNNER: {
        this.vy += g * dt;
        if (input.justPressed && this.onGround) {
          this.vy = -RUNNER_JUMP * this.gravityDir;
          this.onGround = false;
        }
        this.rotation += (this.onGround ? 0 : 1) * dt * 9 * this.gravityDir;
        break;
      }
      case FORMS.GLIDER: {
        this.vy += g * dt;
        if (input.pressed) this.vy -= GLIDER_THRUST * this.gravityDir * dt;
        this.vy = Math.max(-GLIDER_MAX_VY, Math.min(GLIDER_MAX_VY, this.vy));
        this.rotation = (this.vy / GLIDER_MAX_VY) * 0.35;
        break;
      }
      case FORMS.ORB: {
        this.vy += g * dt;
        if (input.justPressed) { this.gravityDir *= -1; this.vy = 0; }
        this.rotation += dt * 6;
        break;
      }
      case FORMS.PULSE: {
        const dir = input.pressed ? -1 : 1;
        this.vy = PULSE_DIAG_SPEED * dir * this.gravityDir;
        this.rotation = Math.atan2(this.vy, this.speed);
        break;
      }
      case FORMS.BOOSTER: {
        this.vy += g * 0.6 * dt;
        if (input.justPressed) {
          this.vy = BOOSTER_BURST_VY * this.gravityDir;
        }
        this.rotation = Math.max(-0.3, Math.min(0.3, this.vy / 900));
        break;
      }
    }

    this.y += this.vy * dt;

    // Corridor clamp for flight forms
    if (this.form === FORMS.GLIDER || this.form === FORMS.PULSE || this.form === FORMS.BOOSTER) {
      if (this.y - this.halfSize < ceilingY) { this.y = ceilingY + this.halfSize; this.vy = Math.max(this.vy, 0); }
    }

    this.justLanded = false;
    // Ground/ceiling snap for runner & orb forms
    if (this.form === FORMS.RUNNER || this.form === FORMS.ORB) {
      if (this.gravityDir === 1) {
        if (this.y + this.halfSize >= groundY) {
          if (!this.onGround) this.justLanded = true;
          this.y = groundY - this.halfSize;
          this.vy = 0;
          this.onGround = true;
          if (this.form === FORMS.RUNNER) this.rotation = Math.round(this.rotation / (Math.PI / 2)) * (Math.PI / 2);
        } else this.onGround = false;
        if (this.y - this.halfSize < ceilingY) { this.y = ceilingY + this.halfSize; this.vy = Math.max(this.vy, 0); }
      } else {
        if (this.y - this.halfSize <= ceilingY) {
          if (!this.onGround) this.justLanded = true;
          this.y = ceilingY + this.halfSize;
          this.vy = 0;
          this.onGround = true;
        } else this.onGround = false;
        if (this.y + this.halfSize > groundY) { this.y = groundY - this.halfSize; this.vy = Math.min(this.vy, 0); }
      }
    }
  }

  getHitbox() {
    const h = this.halfSize;
    if (this.form === FORMS.PULSE) {
      return { x: this.worldX - h * 0.9, y: this.y - h * 0.35, w: h * 1.8, h: h * 0.7 };
    }
    return { x: this.worldX - h, y: this.y - h, w: h * 2, h: h * 2 };
  }

  kill() { this.alive = false; this.deathAt = { x: this.worldX, y: this.y }; }
}

return { Player, FORMS };
};

    { id: 'rain', name: 'Data Rain', cost: 220 },
    { id: 'nebula', name: 'Nebula Drift', cost: 400 },
  ],
};

const CATEGORY_TO_SAVE_KEY = {
  shapes: 'unlockedShapes', trails: 'unlockedTrails', colors: 'unlockedColors',
  deathEffects: 'unlockedDeathEffects', icons: 'unlockedIcons', bgEffects: 'unlockedBgEffects',
};
const CATEGORY_TO_EQUIP_KEY = {
  shapes: 'shape', trails: 'trail', colors: 'color', deathEffects: 'deathEffect', icons: 'icon', bgEffects: 'bgEffect',
};

function  purchaseCosmetic(save, category, id) {
  const item = COSMETICS[category]?.find((c) => c.id === id);
  if (!item) return { ok: false, reason: 'not-found' };
  const key = CATEGORY_TO_SAVE_KEY[category];
  if (save.data[key].includes(id)) return { ok: false, reason: 'owned' };
  if (save.data.currency < item.cost) return { ok: false, reason: 'insufficient-funds' };
  save.data.currency -= item.cost;
  save.data[key].push(id);
  save.save();
  return { ok: true };
}

function  equipCosmetic(save, category, id) {
  const key = CATEGORY_TO_SAVE_KEY[category];
  if (!save.data[key].includes(id)) return { ok: false, reason: 'not-owned' };
  save.data.equipped[CATEGORY_TO_EQUIP_KEY[category]] = id;
  save.save();
  return { ok: true };
}

function  getColorHex(save, colorId) {
  return COSMETICS.colors.find((c) => c.id === colorId)?.hex || '#37f0ff';
}

return { purchaseCosmetic, equipCosmetic, getColorHex, COSMETICS };
};

__defs['progression/Progression.js'] = function(__require) {
// XP/currency economy. Listens to gameplay events on the shared EventBus so
// it never needs to be imported by LevelRuntime directly.

const { EventBus } = __require('core/Utils.js');

const DIFFICULTY_XP = { 1: 20, 2: 25, 3: 35, 4: 45, 5: 60, 6: 75, 7: 95, 8: 120, 9: 160, 10: 220 };
const DIFFICULTY_CURRENCY = { 1: 12, 2: 15, 3: 20, 4: 26, 5: 34, 6: 44, 7: 58, 8: 76, 9: 100, 10: 140 };

function  xpForNextLevel(level) { return Math.round(90 * Math.pow(level, 1.35)); }

class Progression {
  constructor(save) {
    this.save = save;
    this._unsubs = [
      EventBus.on('level:complete', (e) => this.onLevelComplete(e)),
      EventBus.on('level:coin', (e) => this.onCoin(e)),
      EventBus.on('daily:complete', (e) => this.onDailyComplete(e)),
      EventBus.on('achievement:unlocked', (e) => this.onAchievement(e)),
    ];
  }

  addXp(amount) {
    const d = this.save.data;
    d.xp += amount;
    let leveled = false;
    while (d.xp >= xpForNextLevel(d.playerLevel)) {
      d.xp -= xpForNextLevel(d.playerLevel);
      d.playerLevel++;
      leveled = true;
    }
    if (leveled) EventBus.emit('progression:level-up', { level: d.playerLevel });
  }

  addCurrency(amount) { this.save.data.currency += amount; }

  onLevelComplete({ levelId, deaths, practiceMode, difficulty, coinsCollected, totalCoins }) {
    if (practiceMode) return;
    const prog = this.save.getLevelProgress(levelId);
    const firstClear = !prog.completed;
    let xp = DIFFICULTY_XP[difficulty] || 30;
    let cur = DIFFICULTY_CURRENCY[difficulty] || 15;
    if (deaths === 0) { xp += 15; cur += 10; }
    if (firstClear) { xp += 20; cur += 15; }
    xp += coinsCollected * 8;
    cur += coinsCollected * 6;
    this.addXp(xp);
    this.addCurrency(cur);
    this.save.save();
    EventBus.emit('progression:reward', { xp, currency: cur, levelId });
  }

  onCoin() { /* per-coin reward is folded into the level-complete payout to avoid farming by dying repeatedly */ }

  onDailyComplete() {
    this.addXp(60);
    this.addCurrency(50);
    this.save.save();
  }

  onAchievement({ reward }) {
    if (!reward) return;
    if (reward.xp) this.addXp(reward.xp);
    if (reward.currency) this.addCurrency(reward.currency);
    this.save.save();
  }
}

return { xpForNextLevel, Progression };
};

__defs['render/LevelRenderer.js'] = function(__require) {
// Draws a live LevelRuntime frame: parallax background, all obstacle types
// (with neon glow), and the player in its current form/cosmetic loadout.

const { FORMS } = __require('player/Player.js');

function  drawLevel(renderer, level, camX, elapsed) {
  renderer.drawBackground(level.theme, camX, level.groundY, elapsed);
  const ctx = renderer.ctx;
  ctx.save();
  ctx.translate(-camX, 0);

  for (const s of level.solids) {
    if (s.type === 'disappearingPlatform' && !s.visible) continue;
    const color = s.type === 'ground' ? level.theme.ground : level.theme.accent2;
    renderer.glowRect(s.x, s.y, s.w, s.h, color, s.type === 'ground' ? 6 : 12);
    if (s.type === 'disappearingPlatform') {
      ctx.globalAlpha = 0.5;
      renderer.glowRect(s.x, s.y - 3, s.w, 3, '#fff', 6);
      ctx.globalAlpha = 1;
    }
  }

  for (const h of level.hazards) {
    const color = h.fake ? level.theme.hazard : level.theme.hazard;
    ctx.globalAlpha = h.fake ? 0.92 : 1;
    if (h.shape === 'circle') {
      renderer.glowCircle(h.x, h.y, h.r, color, 14);
      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(elapsed * 6);
      ctx.strokeStyle = '#fff8'; ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.rotate(Math.PI / 3); ctx.lineTo(h.r, 0); ctx.stroke(); }
      ctx.restore();
    } else {
      const pts = h.ceiling
        ? [[h.x, h.y], [h.x + h.w / 2, h.y + h.h], [h.x + h.w, h.y]]
        : [[h.x, h.y + h.h], [h.x + h.w / 2, h.y], [h.x + h.w, h.y + h.h]];
      renderer.glowPoly(pts, color, 12);
    }
    ctx.globalAlpha = 1;
  }

  for (const p of level.pads) {
    const color = p.kind === 'pink' ? '#ff37a4' : '#ffd23b';
    renderer.glowRect(p.x, p.y, p.w, p.h, color, 14);
  }

  for (const r of level.rings) {
    renderer.glowCircle(r.x, r.y, r.r, '#37f0ff', 16);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r * 0.5, 0, Math.PI * 2); ctx.stroke();
  }

  for (const p of level.portals) {
    renderer.glowRect(p.x, p.y, p.w, p.h, '#ff37a4', 18);
    if (p.label) renderer.text(p.label, p.x + p.w / 2, p.y - 10, { align: 'center', color: '#fff', glow: '#ff37a4', font: '700 12px Orbitron' });
  }

  for (const c of level.coins) {
    if (c.collected) continue;
    ctx.save();
    ctx.translate(c.x, c.y + Math.sin(elapsed * 4 + c.x * 0.01) * 6);
    ctx.rotate(elapsed * 2);
    renderer.glowCircle(0, 0, c.r, c.hard ? '#ff37a4' : '#ffd23b', 16);
    ctx.restore();
  }

  if (level.checkpoints) {
    for (const cx of level.checkpoints) renderer.glowRect(cx - 3, level.groundY - 120, 6, 120, '#37ff8f', 8);
  }

  if (level.end) renderer.glowRect(level.end.x, level.end.y, level.end.w, level.end.h, '#fff', 20);

  ctx.restore();
}

function  drawPlayer(renderer, player, colorHex, camX) {
  const ctx = renderer.ctx;
  const sx = player.worldX - camX;
  const sy = player.y;
  const h = player.halfSize;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(player.rotation);

  ctx.shadowColor = colorHex;
  ctx.shadowBlur = 22;
  ctx.fillStyle = colorHex;

  switch (player.form) {
    case FORMS.RUNNER:
      ctx.fillRect(-h, -h, h * 2, h * 2);
      ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 2; ctx.strokeRect(-h, -h, h * 2, h * 2);
      break;
    case FORMS.ORB:
      ctx.beginPath(); ctx.arc(0, 0, h, 0, Math.PI * 2); ctx.fill();
      break;
    case FORMS.GLIDER:
      ctx.beginPath(); ctx.moveTo(-h, -h * 0.6); ctx.lineTo(h, 0); ctx.lineTo(-h, h * 0.6); ctx.closePath(); ctx.fill();
      break;
    case FORMS.PULSE:
      ctx.beginPath(); ctx.moveTo(-h, 0); ctx.lineTo(0, -h * 0.5); ctx.lineTo(h, 0); ctx.lineTo(0, h * 0.5); ctx.closePath(); ctx.fill();
      break;
    case FORMS.BOOSTER:
      ctx.beginPath(); ctx.ellipse(0, 0, h, h * 0.7, 0, 0, Math.PI * 2); ctx.fill();
      break;
  }
  ctx.restore();
}

return { drawLevel, drawPlayer };
};

__defs['render/ParticleSystem.js'] = function(__require) {
// Lightweight pooled particle system for trails, death bursts and coin pops.

class ParticleSystem {
  constructor() {
    this.particles = [];
    this.enabled = true;
  }

  burst(x, y, color, count = 18, opts = {}) {
    if (!this.enabled) return;
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (opts.speed || 180) * (0.4 + Math.random() * 0.8);
      this.particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: opts.life || 0.6,
        age: 0,
        size: opts.size || 4 + Math.random() * 3,
        color,
        gravity: opts.gravity ?? 400,
      });
    }
  }

  trail(x, y, color, size = 3) {
    if (!this.enabled) return;
    this.particles.push({ x, y, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20, life: 0.4, age: 0, size, color, gravity: 0 });
  }

  update(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.age += dt;
      if (p.age >= p.life) { this.particles.splice(i, 1); continue; }
      p.vy += p.gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    if (this.particles.length > 800) this.particles.splice(0, this.particles.length - 800);
  }

  render(ctx, camX) {
    for (const p of this.particles) {
      const t = 1 - p.age / p.life;
      ctx.globalAlpha = Math.max(0, t);
      ctx.fillStyle = p.color;
      const s = p.size * t;
      ctx.beginPath();
      ctx.arc(p.x - camX, p.y, Math.max(s, 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  clear() { this.particles.length = 0; }
}

return { ParticleSystem };
};

__defs['render/Renderer.js'] = function(__require) {
// Canvas renderer: parallax backgrounds, glow-heavy neon obstacle drawing,
// camera/screen shake, and beat-synced background pulsing.

class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.width = canvas.width;
    this.height = canvas.height;
    this.shake = 0;
    this.pulse = 0; // 0..1 decays, driven by audio beats
    this.quality = 'high';
    this.resize();
    window.addEventListener('resize', () => this.resize());
  }

  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = this.canvas.getBoundingClientRect();
    this.width = rect.width;
    this.height = rect.height;
    this.canvas.width = Math.floor(rect.width * dpr);
    this.canvas.height = Math.floor(rect.height * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  addShake(amount) { this.shake = Math.min(this.shake + amount, 24); }
  addPulse(amount = 1) { this.pulse = Math.min(1, this.pulse + amount); }

  beginFrame(dt) {
    this.shake *= Math.max(0, 1 - dt * 6);
    this.pulse *= Math.max(0, 1 - dt * 4);
    const ctx = this.ctx;
    ctx.save();
    if (this.shake > 0.3) {
      const sx = (Math.random() - 0.5) * this.shake;
      const sy = (Math.random() - 0.5) * this.shake;
      ctx.translate(sx, sy);
    }
  }

  endFrame() { this.ctx.restore(); }

  clear() {
    this.ctx.clearRect(-40, -40, this.width + 80, this.height + 80);
  }

  drawBackground(theme, camX, groundY, time) {
    const ctx = this.ctx;
    const grad = ctx.createLinearGradient(0, 0, 0, this.height);
    grad.addColorStop(0, theme.bg2);
    grad.addColorStop(1, theme.bg1);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, this.width, this.height);

    // Pulsating glow overlay synced to music beats
    if (this.pulse > 0.01) {
      ctx.fillStyle = theme.accent;
      ctx.globalAlpha = this.pulse * 0.08;
      ctx.fillRect(0, 0, this.width, this.height);
      ctx.globalAlpha = 1;
    }

    // Parallax layers: far shapes drift slowly, near stripes drift faster
    this._drawParallaxLayer(camX * 0.15, theme.accent2, 0.05, 60, groundY, time, 40);
    this._drawParallaxLayer(camX * 0.35, theme.accent, 0.08, 34, groundY, time, 90);
    this._drawGroundGlow(theme, groundY);
  }

  _drawParallaxLayer(offset, color, alpha, size, groundY, time, spacing) {
    const ctx = this.ctx;
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha;
    const start = Math.floor(-offset / spacing) * spacing;
    for (let x = start; x < start + this.width + spacing * 2; x += spacing) {
      const sx = x + offset;
      const bob = Math.sin((x * 0.01) + time * 0.6) * 14;
      ctx.beginPath();
      ctx.arc((sx % (this.width + spacing * 4)) - offset % spacing, groundY - 120 - bob - (size % 200), size * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  _drawGroundGlow(theme, groundY) {
    const ctx = this.ctx;
    const grad = ctx.createLinearGradient(0, groundY - 40, 0, groundY + 6);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, theme.accent);
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = grad;
    ctx.fillRect(0, groundY - 40, this.width, 46);
    ctx.globalAlpha = 1;
  }

  glowRect(x, y, w, h, color, glow = 14) {
    const ctx = this.ctx;
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = glow;
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
    ctx.restore();
  }

  glowPoly(points, color, glow = 14, fill = true) {
    const ctx = this.ctx;
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = glow;
    ctx.beginPath();
    points.forEach(([px, py], i) => (i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py)));
    ctx.closePath();
    if (fill) { ctx.fillStyle = color; ctx.fill(); }
    else { ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke(); }
    ctx.restore();
  }

  glowCircle(x, y, r, color, glow = 14) {
    const ctx = this.ctx;
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = glow;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  text(str, x, y, opts = {}) {
    const ctx = this.ctx;
    ctx.save();
    ctx.font = opts.font || '16px "Segoe UI", sans-serif';
    ctx.fillStyle = opts.color || '#fff';
    ctx.textAlign = opts.align || 'left';
    ctx.textBaseline = opts.baseline || 'alphabetic';
    if (opts.glow) { ctx.shadowColor = opts.glow; ctx.shadowBlur = 10; }
    ctx.fillText(str, x, y);
    ctx.restore();
  }
}

__defs['stats/Statistics.js'] = function(__require) {
// Passive listener that keeps save.data.stats up to date from gameplay
// events. Nothing here computes rewards — that's Progression's job.

const { EventBus } = __require('core/Utils.js');
const { getLevelMeta } = __require('levels/levelList.js');

const CATEGORY_RANK = { Easy: 1, Normal: 2, Hard: 3, Insane: 4, Demon: 5 };

class Statistics {
  constructor(save) {
    this.save = save;
    this._playtimeAccum = 0;
    this._unsubs = [
      EventBus.on('level:attempt-start', () => this._bump('totalAttempts')),
      EventBus.on('level:death', () => this._bump('totalDeaths')),
      EventBus.on('level:jump', () => this._bump('totalJumps')),
      EventBus.on('level:coin', () => this._bump('coinsCollected')),
      EventBus.on('level:complete', (e) => this._onComplete(e)),
      EventBus.on('practice:session', () => this._bump('practiceSessions')),
    ];
  }

  _bump(key, by = 1) { this.save.data.stats[key] = (this.save.data.stats[key] || 0) + by; this.save.save(); }

  tick(dt, distanceThisFrame) {
    this._playtimeAccum += dt;
    this.save.data.stats.totalDistance += distanceThisFrame;
    if (this._playtimeAccum > 1) {
      this.save.data.stats.totalPlaytimeMs += Math.floor(this._playtimeAccum * 1000);
      this._playtimeAccum = 0;
      this.save.save();
    }
  }

  _onComplete({ levelId, practiceMode }) {
    if (practiceMode) return;
    const s = this.save.data.stats;
    s.levelsCompleted++;
    const meta = getLevelMeta(levelId);
    if (meta) {
      const rank = CATEGORY_RANK[meta.category];
      const curRank = s.hardestLevelCompleted ? CATEGORY_RANK[getLevelMeta(s.hardestLevelCompleted)?.category] || 0 : 0;
      if (rank > curRank || (rank === curRank && meta.difficulty > (getLevelMeta(s.hardestLevelCompleted)?.difficulty || 0))) {
        s.hardestLevelCompleted = levelId;
      }
      if (!s.bestLevelId) s.bestLevelId = levelId;
    }
    this.save.save();
  }
}

return { Statistics };
};

// Central screen router. Each screen module exports render(root, game) and
// returns nothing — screens fully own their DOM subtree under #ui-root and
// re-render themselves as needed via game.ui.refresh().

const { clear } = __require('ui/dom.js');
const { renderMainMenu } = __require('ui/screens/MainMenu.js');
const { renderLevelSelect } = __require('ui/screens/LevelSelect.js');
const { renderShop } = __require('ui/screens/Shop.js');
const { renderSettings } = __require('ui/screens/Settings.js');
const { renderAchievements } = __require('ui/screens/Achievements.js');
const { renderStatistics } = __require('ui/screens/Statistics.js');
const { renderDailyChallenge } = __require('ui/screens/DailyChallenge.js');
const { renderPracticeSetup } = __require('ui/screens/PracticePanel.js');

const SCREENS = {
  mainMenu: renderMainMenu,
  levelSelect: renderLevelSelect,
  shop: renderShop,
  settings: renderSettings,
  achievements: renderAchievements,
  statistics: renderStatistics,
  daily: renderDailyChallenge,
  practiceSetup: renderPracticeSetup,
};

class UIManager {
  constructor(root, game) {
    this.root = root;
    this.game = game;
    this.current = null;
    this.params = null;
  }

  showScreen(name, params = {}) {
    this.current = name;
    this.params = params;
    this.refresh();
  }

  hide() {
    this.current = null;
    clear(this.root);
  }

  refresh() {
    clear(this.root);
    if (!this.current) return;
    const fn = SCREENS[this.current];
    if (!fn) { console.warn('Unknown screen', this.current); return; }
    fn(this.root, this.game, this.params);
  }

  toast(message) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = message;
    document.getElementById('app').appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }
}

return { UIManager };
};

__defs['ui/dom.js'] = function(__require) {
// Tiny DOM-building helper shared by every screen — keeps screen files
// declarative without pulling in a framework.

function  el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== undefined && v !== null && v !== false) node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of [].concat(children)) {
    if (c === null || c === undefined) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}

function  clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

function  fmtTime(ms) {
  if (ms === null || ms === undefined) return '--:--.--';
  const totalMs = Math.max(0, ms);
  const m = Math.floor(totalMs / 60000);
  const s = Math.floor((totalMs % 60000) / 1000);
  const cs = Math.floor((totalMs % 1000) / 10);
  return `${m}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
}

function  fmtDuration(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}

return { el, clear, fmtTime, fmtDuration };
};

__defs['ui/screens/HUD.js'] = function(__require) {
const { el, clear, fmtTime } = __require('ui/dom.js');

// The live HUD is rebuilt once per level (not per frame) and then patched
// cheaply every frame via update() to avoid DOM-churn during gameplay.
class HUD {
  constructor(hudRoot, game) {
    this.hudRoot = hudRoot;
    this.game = game;
    this.els = {};
  }

  mount(runtime) {
    clear(this.hudRoot);
    const track = el('div', { class: 'progress-track' }, [el('div', { class: 'progress-fill' })]);
    const attempt = el('div', { class: 'attempt-badge' }, [`Attempt ${runtime.attempts}`]);
    const coinHud = el('div', { class: 'coin-hud' }, runtime.level.coins.map(() => el('div', { class: 'pip' })));
    const pauseBtn = el('button', {
      class: 'btn small interactive', style: 'position:absolute; top:34px; left:14px; pointer-events:auto;',
      onClick: () => this.game.togglePause(),
    }, ['❚❚']);

    this.hudRoot.appendChild(track);
    this.hudRoot.appendChild(attempt);
    this.hudRoot.appendChild(coinHud);
    this.hudRoot.appendChild(pauseBtn);

    if (runtime.practiceMode) {
      const badge = el('div', { class: 'practice-badge' }, ['PRACTICE MODE']);
      this.hudRoot.appendChild(badge);
      this.hudRoot.appendChild(this._practiceControls(runtime));
    }

    this.els = { fill: track.firstChild, attempt, coinPips: [...coinHud.children] };
  }

  _practiceControls(runtime) {
    const wrap = el('div', {
      class: 'row interactive', style: 'position:absolute; bottom:14px; left:50%; transform:translateX(-50%); gap:6px; pointer-events:auto;',
    });
    wrap.appendChild(el('button', { class: 'btn small', onClick: () => runtime.addCheckpoint() }, ['+ Checkpoint']));
    wrap.appendChild(el('button', { class: 'btn small', onClick: () => { runtime.clearCheckpoints(); this.game.ui.toast('Checkpoints cleared'); } }, ['Clear']));
    const cpToggle = el('button', {
      class: 'btn small', onClick: (e) => { runtime.checkpointsEnabled = !runtime.checkpointsEnabled; e.target.textContent = `Checkpoints: ${runtime.checkpointsEnabled ? 'On' : 'Off'}`; },
    }, ['Checkpoints: On']);
    wrap.appendChild(cpToggle);
    const speedBtn = el('button', { class: 'btn small' }, ['Speed: 1x']);
    const speeds = [1, 0.75, 0.5];
    let speedIdx = 0;
    speedBtn.addEventListener('click', () => {
      speedIdx = (speedIdx + 1) % speeds.length;
      runtime.setSpeedScale(speeds[speedIdx]);
      speedBtn.textContent = `Speed: ${speeds[speedIdx]}x`;
    });
    wrap.appendChild(speedBtn);
    wrap.appendChild(el('button', { class: 'btn small danger', onClick: () => this.game.exitToMenu() }, ['Exit']));
    return wrap;
  }

  update(runtime) {
    if (!this.els.fill) return;
    this.els.fill.style.width = `${runtime.percent}%`;
    this.els.attempt.textContent = `Attempt ${runtime.attempts}`;
    runtime.level.coins.forEach((c, i) => {
      const pip = this.els.coinPips[i];
      if (pip) pip.classList.toggle('on', !!c.collected);

__defs['ui/screens/LevelSelect.js'] = function(__require) {
const { el, clear, fmtTime } = __require('ui/dom.js');
const { LEVEL_META, CATEGORIES } = __require('levels/levelList.js');

let activeFilter = 'All';
let sortMode = 'id';

function  renderLevelSelect(root, game) {
  const screen = el('div', { class: 'screen' });
  screen.appendChild(el('button', { class: 'btn small close-x interactive', onClick: () => game.ui.showScreen('mainMenu') }, ['✕ Back']));
  screen.appendChild(el('h2', { class: 'title-font' }, ['Level Select']));

  const filterBar = el('div', { class: 'filter-bar' });
  const cats = ['All', ...CATEGORIES];
  for (const c of cats) {
    filterBar.appendChild(el('div', {
      class: `chip interactive${activeFilter === c ? ' active' : ''}`,
      onClick: () => { activeFilter = c; game.ui.refresh(); },
    }, [c]));
  }
  const sortChip = el('div', {
    class: 'chip interactive',
    onClick: () => { sortMode = sortMode === 'id' ? 'progress' : 'id'; game.ui.refresh(); },
  }, [sortMode === 'id' ? 'Sort: Level #' : 'Sort: Progress']);
  filterBar.appendChild(sortChip);
  screen.appendChild(filterBar);

  const grid = el('div', { class: 'level-grid' });
  let levels = activeFilter === 'All' ? LEVEL_META : LEVEL_META.filter((l) => l.category === activeFilter);
  levels = [...levels];
  if (sortMode === 'progress') levels.sort((a, b) => (game.save.getLevelProgress(b.id).bestPercent) - (game.save.getLevelProgress(a.id).bestPercent));
  else levels.sort((a, b) => a.id - b.id);

  for (const meta of levels) grid.appendChild(levelCard(meta, game));
  screen.appendChild(grid);
  root.appendChild(screen);
}

  const stars = '★'.repeat(meta.difficulty) + '☆'.repeat(10 - meta.difficulty);
  const card = el('div', {
    class: 'level-card interactive',
    style: `border-left: 4px solid ${meta.theme.accent}`,
    onClick: () => game.startLevel(meta.id),
  }, [
    el('div', { class: 'lname' }, [`${meta.id}. ${meta.name}`]),
    el('div', { class: 'small-text' }, [meta.category]),
    el('div', { class: 'stars', style: 'font-size:0.7rem;' }, [stars.slice(0, 10)]),
    el('div', { class: 'row', style: 'margin-top:6px;' }, coinPips(prog.coins)),
    el('div', { class: 'progress-bar' }, [el('div', { style: `width:${prog.bestPercent}%` })]),
    el('div', { class: 'lmeta' }, [
      el('span', {}, [`Best: ${Math.floor(prog.bestPercent)}%`]),
      el('span', {}, [prog.completed ? `✓ ${fmtTime(prog.bestTimeMs)}` : `${prog.attempts} tries`]),
    ]),
  ]);
  return card;
}

function coinPips(coins) {
  return coins.map((on) => el('span', { style: `color:${on ? '#ffd23b' : 'rgba(255,255,255,0.15)'}; margin-right:3px;` }, ['●']));

  const wrap = el('label', { class: 'field' }, [label]);
  const sel = el('select', { class: 'interactive' });
  for (const o of options) sel.appendChild(el('option', { value: o, selected: o === value }, [o]));
  sel.addEventListener('change', (e) => onChange(e.target.value));
  wrap.appendChild(sel);
  return wrap;
}

return { renderSettings };
};

__defs['ui/screens/Shop.js'] = function(__require) {
const { el } = __require('ui/dom.js');
const { COSMETICS, purchaseCosmetic, equipCosmetic } = __require('progression/Cosmetics.js');
const { EventBus } = __require('core/Utils.js');

let activeTab = 'shapes';
const TAB_LABELS = { shapes: 'Shapes', trails: 'Trails', colors: 'Colors', deathEffects: 'Death FX', icons: 'Icons', bgEffects: 'Backgrounds' };
const SAVE_KEY = { shapes: 'unlockedShapes', trails: 'unlockedTrails', colors: 'unlockedColors', deathEffects: 'unlockedDeathEffects', icons: 'unlockedIcons', bgEffects: 'unlockedBgEffects' };
const EQUIP_KEY = { shapes: 'shape', trails: 'trail', colors: 'color', deathEffects: 'deathEffect', icons: 'icon', bgEffects: 'bgEffect' };

function  renderShop(root, game) {
  const d = game.save.data;
  const screen = el('div', { class: 'screen' });
  screen.appendChild(el('button', { class: 'btn small close-x interactive', onClick: () => game.ui.showScreen('mainMenu') }, ['✕ Back']));
  screen.appendChild(el('h2', { class: 'title-font' }, ['Shop']));
  screen.appendChild(el('div', { class: 'currency-badge', style: 'margin-bottom:16px;' }, [`◆ ${d.currency}`]));

  const tabs = el('div', { class: 'tabs' });
  for (const key of Object.keys(TAB_LABELS)) {
    tabs.appendChild(el('div', { class: `chip interactive${activeTab === key ? ' active' : ''}`, onClick: () => { activeTab = key; game.ui.refresh(); } }, [TAB_LABELS[key]]));
  }
  screen.appendChild(tabs);

  const grid = el('div', { class: 'cosmetic-grid' });
  const owned = d[SAVE_KEY[activeTab]];
  const equipped = d.equipped[EQUIP_KEY[activeTab]];
  for (const item of COSMETICS[activeTab]) {
    const isOwned = owned.includes(item.id);
    const isEquipped = equipped === item.id;
    const swatchColor = item.hex || '#6a4dff';
    grid.appendChild(el('div', { class: `cosmetic-card${isEquipped ? ' equipped' : ''}` }, [
      el('div', { class: 'swatch', style: `background:${swatchColor}; box-shadow: inset 0 0 20px rgba(0,0,0,0.4), 0 0 12px ${swatchColor}55;` }),
      el('div', { style: 'font-size:0.8rem; font-weight:700; margin-bottom:6px;' }, [item.name]),
      isOwned
        ? el('button', {
          class: `btn small interactive${isEquipped ? '' : ' primary'}`, disabled: isEquipped,
          onClick: () => { equipCosmetic(game.save, activeTab, item.id); game.ui.refresh(); },
        }, [isEquipped ? 'Equipped' : 'Equip'])
        : el('button', {
          class: 'btn small interactive', disabled: d.currency < item.cost,
          onClick: () => {
            const res = purchaseCosmetic(game.save, activeTab, item.id);
            if (res.ok) { EventBus.emit('shop:purchase', item); game.ui.toast(`Unlocked ${item.name}!`); }
            game.ui.refresh();
          },
        }, [item.cost === 0 ? 'Free' : `◆ ${item.cost}`]),
    ]));
  }
  screen.appendChild(grid);
  root.appendChild(screen);
}

return { renderShop };
};
